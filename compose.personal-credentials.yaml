# Personal localhost only. Never contains an API Key or encryption master.
services:
  credential-init:
    profiles: [credential-bootstrap]
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    user: "0:0"
    entrypoint: [/bin/sh, /scripts/credential-volumes.sh, initialize]
    network_mode: none
    read_only: true
    volumes:
      - credential-ciphertext:/ciphertext
      - credential-master:/master
      - ./scripts/credential-volumes.sh:/scripts/credential-volumes.sh:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    pids_limit: 32
    mem_limit: 32m

  credential-check:
    profiles: [credential-bootstrap]
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    user: "10001:10001"
    entrypoint: [/bin/sh, /scripts/credential-volumes.sh, verify]
    network_mode: none
    read_only: true
    volumes:
      - credential-ciphertext:/ciphertext:ro
      - credential-master:/master:ro
      - ./scripts/credential-volumes.sh:/scripts/credential-volumes.sh:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 32
    mem_limit: 32m

  archguard-platform:
    image: archguard/platform:personal-credentials-local
    build:
      context: ${ARCHGUARD_PLATFORM_CONTEXT:?set the verified credential Platform context}
    environment:
      SPRING_PROFILES_ACTIVE: oidc,local-compose
      ARCHGUARD_AGENT_ENABLED: "false"
      ARCHGUARD_AGENT_SYNTHETIC_ENABLED: "false"
      ARCHGUARD_CREDENTIAL_MANAGEMENT_ENABLED: ${ARCHGUARD_CREDENTIAL_MANAGEMENT_ENABLED:-false}
      ARCHGUARD_CREDENTIAL_OWNER_ID: ${ARCHGUARD_CREDENTIAL_OWNER_ID:?confirm the dedicated OIDC UUID}
      ARCHGUARD_CREDENTIAL_DEPLOYMENT_ID: ${ARCHGUARD_CREDENTIAL_DEPLOYMENT_ID:?retain a stable deployment UUID}
      ARCHGUARD_CREDENTIAL_UI_ORIGIN: http://localhost:${ARCHGUARD_LOCAL_PORT:-8080}
      ARCHGUARD_CREDENTIAL_ALLOW_LOOPBACK_HTTP: "true"
      ARCHGUARD_CREDENTIAL_DIRECTORY: /var/lib/archguard/credentials
      ARCHGUARD_CREDENTIAL_MASTER_FILE: /run/archguard-master/master.key
    volumes:
      - credential-ciphertext:/var/lib/archguard/credentials
      - credential-master:/run/archguard-master:ro

  archguard-web:
    image: archguard/web:personal-credentials-local
    build:
      context: ${ARCHGUARD_WEB_CONTEXT:?set the verified credential Web context}
      args:
        VITE_AGENT_UI_ENABLED: "false"
        VITE_CREDENTIAL_UI_ENABLED: ${ARCHGUARD_CREDENTIAL_UI_ENABLED:-false}

volumes:
  credential-ciphertext:
  credential-master:
