server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Old applications have no Agent routes. Keep stale clients away from them.
  location ~ ^/api/v1/projects/[^/]+/(agent|documents)(/|$) {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"code":"agent.unavailable","message":"Agent unavailable during rollback","traceId":"$request_id","details":{}}';
  }
  location /api/ {
    proxy_pass http://archguard-platform:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }
  location = /auth/callback {
    try_files /index.html =404;
  }
  location /auth/ {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    try_files $uri /index.html;
  }
}
